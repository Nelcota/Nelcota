# cargo deny check — licenses, advisories, sources and duplicates.

[graph]
all-features = false

[advisories]
# Same rationale as .cargo/audit.toml (see docs/decisions.md).
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa only used to verify (we never sign with RSA)" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256/p384: ECDSA only verifies public signatures (D104)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots: Mozilla's list of certificate authorities (data), used by
    # sending email over SMTP with TLS. A permissive license for data.
    "CDLA-Permissive-2.0",
    # quoted_printable (email body encoding, via lettre). OSI approved; more
    # permissive than MIT (does not even require keeping the copyright notice).
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
