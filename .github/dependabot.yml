# Weekly version updates, grouped per ecosystem so they arrive as one PR
# each. New releases wait two weeks first: a compromised version is usually
# caught and yanked within days. Security updates are not delayed. The JS
# packages apply the same 14 days on install (minimumReleaseAge in bunfig.toml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      tooling:
        patterns: ["*"]
    ignore:
      # Compiler API consumers still require TypeScript 6; the CLI has its own alias.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /crates/admin/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      panel:
        patterns: ["*"]
    ignore:
      # `tsc` is TypeScript 7 (`typescript-7`). `typescript` is the TS 6
      # compiler API package that svelte-check still needs (its peer range
      # stops at 6): drop it once svelte-check supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /sdk/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      sdk:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
