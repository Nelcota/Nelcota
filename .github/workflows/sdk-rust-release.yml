name: Rust SDK release

# Publishes nelcota-client to crates.io from a `rust-sdk-v<version>` tag with
# crates.io trusted publishing (OIDC, no token stored in the repository).
# Before the first run, add this repository, this workflow and the
# `crates-io` environment as a trusted publisher of nelcota-client on
# crates.io (crate settings → Trusted Publishing).

on:
  push:
    tags: ['rust-sdk-v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/sdk-rust-check.yml
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: scripts/test.sh rust --locked -p nelcota-api --lib rust::tests
      - run: scripts/test.sh rust --locked -p nelcota-server --test sdk_rust
      - run: scripts/test.sh rust --locked -p nelcota-server --test oauth rust_sdk_finishes_a_real_pkce_flow
  publish:
    needs: [checks, contract]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - name: tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('sdk/rust/Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['RELEASE_TAG'] == f'rust-sdk-v{version}', 'tag/version mismatch'
          PY
      # A version published by hand (the first one) is not published again.
      - name: skip a version already on crates.io
        id: published
        run: |
          version=${GITHUB_REF_NAME#rust-sdk-v}
          if curl -fsS -A "nelcota-release (github.com/Nelcota/Nelcota)" "https://crates.io/api/v1/crates/nelcota-client/$version" >/dev/null 2>&1; then
            echo "::notice::nelcota-client $version is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish -p nelcota-client --dry-run
      # Trusted publishing: a short-lived token from this workflow's OIDC
      # identity, no long-lived secret in the repository.
      - if: steps.published.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish -p nelcota-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
