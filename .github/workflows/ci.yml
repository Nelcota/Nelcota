name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its previous run. Runs on main
# always finish so every merged commit keeps a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep file/line backtraces but drop full debuginfo: the workspace links
  # dozens of test binaries, and smaller ones link faster and cache smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  # Formatting, architecture/doc scripts and clippy: fast feedback without tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: python3 scripts/check-boundaries.py
      - run: python3 scripts/check-doc-versions.py
      - run: cargo clippy --all-targets -- -D warnings

  # The whole workspace test suite, split across runners. Integration tests
  # start Postgres 17 via testcontainers (the runner's Docker), one cluster per
  # TestApp as before; only the test-to-runner assignment changes.
  test:
    name: test (${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # Two concurrent tests per runner, as RUST_TEST_THREADS sets for cargo test.
      # sql_cancellation runs once, in its dedicated low-priority step under
      # the integration job.
      - run: >-
          cargo nextest run --workspace --partition slice:${{ matrix.partition }}/3
          --test-threads 2 -E 'not (package(nelcota-server) & binary(sql_cancellation))'
      # nextest does not run doctests.
      - if: matrix.partition == 1
        run: cargo test --workspace --doc

  # Scripted end-to-end checks against the built binary.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      # Build first so the timeout below covers only the controls.
      - run: cargo test --locked -p nelcota-server --test sql_cancellation --no-run
      - name: Dedicated SQL and export cancellation ownership controls
        timeout-minutes: 2
        run: nice -n19 ionice -c3 cargo test --locked -p nelcota-server --test sql_cancellation -- --nocapture
      - name: documented Notes onboarding
        timeout-minutes: 5
        run: |
          cargo build --locked -p nelcota-server
          python3 scripts/test-migration-backup.py --binary target/debug/nelcota
          python3 scripts/test-dev.py --binary target/debug/nelcota --remote-migrations
          python3 scripts/test-onboarding.py --binary target/debug/nelcota
      - name: Notes acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-native-acceptance
          path: .tools/reports/onboarding/**/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: auth archive consumer
        run: |
          cargo package -p nelcota-core -p nelcota-auth --no-verify
          python3 scripts/test-auth-package.py --run

      # Storage on a real S3-compatible service (presigned URLs, multipart).
      - name: storage on S3
        env:
          AWS_ACCESS_KEY_ID: nelcotatest
          AWS_SECRET_ACCESS_KEY: nelcotatestsecret
          AWS_DEFAULT_REGION: us-east-1
          NELCOTA_TEST_S3_ENDPOINT: http://127.0.0.1:9100
          NELCOTA_TEST_S3_BUCKET: nelcota-files
          NELCOTA_TEST_S3_ACCESS_KEY_ID: nelcotatest
          NELCOTA_TEST_S3_SECRET_ACCESS_KEY: nelcotatestsecret
        run: |
          docker run -d --name s3 -p 127.0.0.1:9100:9000 \
            -e RUSTFS_ACCESS_KEY=nelcotatest -e RUSTFS_SECRET_KEY=nelcotatestsecret \
            rustfs/rustfs:1.0.1
          for _ in $(seq 1 30); do
            aws --endpoint-url "$NELCOTA_TEST_S3_ENDPOINT" s3 mb s3://nelcota-files && break
            sleep 1
          done
          cargo test -p nelcota-server --test storage_s3 -- --ignored
          # The COMMIT fault cases collect old versions; never mix their
          # physical object namespace with the other provider fixtures.
          aws --endpoint-url "$NELCOTA_TEST_S3_ENDPOINT" s3 mb s3://nelcota-commit
          NELCOTA_TEST_S3_COMMIT_BUCKET=nelcota-commit \
            cargo test --locked -p nelcota-server --test storage_commit -- --ignored

  # The longest scripted scenario runs on its own runner.
  host-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - run: cargo build --locked -p nelcota-server
      - name: host project lifecycle and interrupted restore
        timeout-minutes: 12
        run: python3 scripts/test-host-management.py --binary target/debug/nelcota

  # The required status check: passes only when every Rust job above passed.
  # `always()` keeps a failed or cancelled dependency from turning this job
  # into "skipped", which branch protection would accept as passing.
  check:
    if: always()
    needs: [lint, test, integration, host-lifecycle]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  native-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install-oxlint.py
      - run: python3 scripts/run-preset.py base
      - run: python3 scripts/run-preset.py performance/imports
      - run: python3 -m unittest discover -s scripts/review_tests -v

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24 runtime
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p nelcota-server
      # Check both the published release and this PR's binary. A fresh cluster
      # per scenario also exercises V13's new cluster-wide role creation.
      - name: upgrade v0.3.1 to the checkout
        run: python3 scripts/test-upgrade.py
      - name: upgrade v0.3.1 to published v0.4.0
        run: python3 scripts/test-upgrade.py --published-target
      - name: upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-diagnostics
          path: |
            target/upgrade-tests/**/*.log
            target/upgrade-tests/**/report.json
            target/upgrade-tests/**/before.json
            target/upgrade-tests/**/after.json
          if-no-files-found: ignore
          retention-days: 7

  # The panel build (crates/admin/ui/dist) is versioned so `cargo build` does
  # not depend on Node. This job makes sure it is up to date.
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/admin/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun scripts/contracts.ts
      - name: generated browser validators are up to date
        run: git diff --exit-code -- src/lib/generated
      - run: bun run check
      - run: bun run test
      - run: bun run test:memory
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: e2e traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-e2e-traces
          path: crates/admin/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: bun run build
      # status (not diff): also catches a new file that was not versioned or a
      # versioned file the build no longer produces.
      - name: versioned dist is up to date
        run: |
          changes=$(git status --porcelain -- dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::dist is out of date: run bun run build and commit the result"
            exit 1
          fi

  # The same checks gate pull requests and SDK publication.
  sdk:
    uses: ./.github/workflows/sdk-check.yml

  nextjs-sdk:
    uses: ./.github/workflows/sdk-nextjs-check.yml
