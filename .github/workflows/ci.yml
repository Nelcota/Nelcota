name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: python3 scripts/check-boundaries.py
      - run: python3 scripts/check-doc-versions.py
      - run: cargo clippy --all-targets -- -D warnings
      # Integration tests start Postgres 17 via testcontainers (the runner's Docker).
      - run: cargo test --all
      - name: Dedicated SQL and export cancellation ownership controls
        timeout-minutes: 2
        run: nice -n19 ionice -c3 cargo test --locked -p nelcota-server --test sql_cancellation -- --nocapture
      - name: documented Notes onboarding
        timeout-minutes: 5
        run: |
          cargo build --locked -p nelcota-server
          python3 scripts/test-onboarding.py --binary target/debug/nelcota
      - name: Notes acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-native-acceptance
          path: .tools/reports/onboarding/**/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: auth archive consumer
        run: |
          cargo package -p nelcota-core -p nelcota-auth --no-verify
          python3 scripts/test-auth-package.py --run

      - name: host project lifecycle and interrupted restore
        timeout-minutes: 12
        run: python3 scripts/test-host-management.py --binary target/debug/nelcota

      # Storage on a real S3-compatible service (presigned URLs, multipart).
      - name: storage on S3
        env:
          AWS_ACCESS_KEY_ID: nelcotatest
          AWS_SECRET_ACCESS_KEY: nelcotatestsecret
          AWS_DEFAULT_REGION: us-east-1
          NELCOTA_TEST_S3_ENDPOINT: http://127.0.0.1:9100
          NELCOTA_TEST_S3_BUCKET: nelcota-files
          NELCOTA_TEST_S3_ACCESS_KEY_ID: nelcotatest
          NELCOTA_TEST_S3_SECRET_ACCESS_KEY: nelcotatestsecret
        run: |
          docker run -d --name s3 -p 127.0.0.1:9100:9000 \
            -e RUSTFS_ACCESS_KEY=nelcotatest -e RUSTFS_SECRET_KEY=nelcotatestsecret \
            rustfs/rustfs:1.0.1
          for _ in $(seq 1 30); do
            aws --endpoint-url "$NELCOTA_TEST_S3_ENDPOINT" s3 mb s3://nelcota-files && break
            sleep 1
          done
          cargo test -p nelcota-server --test storage_s3 -- --ignored

  native-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/install-oxlint.py
      - run: python3 scripts/run-preset.py base
      - run: python3 scripts/run-preset.py performance/imports
      - run: python3 -m unittest discover -s scripts/review_tests -v

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p nelcota-server
      # Check both the published release and this PR's binary. A fresh cluster
      # per scenario also exercises V13's new cluster-wide role creation.
      - name: upgrade v0.3.1 to the checkout
        run: python3 scripts/test-upgrade.py
      - name: upgrade v0.3.1 to published v0.4.0
        run: python3 scripts/test-upgrade.py --published-target
      - name: upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-diagnostics
          path: |
            target/upgrade-tests/**/*.log
            target/upgrade-tests/**/report.json
            target/upgrade-tests/**/before.json
            target/upgrade-tests/**/after.json
          if-no-files-found: ignore
          retention-days: 7

  # The panel build (crates/admin/ui/dist) is versioned so `cargo build` does
  # not depend on Node. This job makes sure it is up to date.
  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/admin/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/admin/ui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/contracts.mjs
      - name: generated browser validators are up to date
        run: git diff --exit-code -- src/lib/generated
      - run: npm run check
      - run: npm test
      - run: npm run test:memory
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: e2e traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-e2e-traces
          path: crates/admin/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      # status (not diff): also catches a new file that was not versioned or a
      # versioned file the build no longer produces.
      - name: versioned dist is up to date
        run: |
          changes=$(git status --porcelain -- dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::dist is out of date: run npm run build and commit the result"
            exit 1
          fi

  # The same checks gate pull requests and SDK publication.
  sdk:
    uses: ./.github/workflows/sdk-check.yml

  # Private Next.js candidate: unit, real PostgreSQL store and packed consumer.
  nextjs-sdk:
    runs-on: ubuntu-latest
    env:
      NELCOTA_NEXT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/nextjs/package-lock.json
      - name: disposable PostgreSQL
        run: |
          docker run -d --name pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=postgres postgres:17-alpine
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      # The candidate links the base SDK through file:../typescript.
      - name: base SDK build
        working-directory: sdk/typescript
        run: npm ci && npm run build
      - working-directory: sdk/nextjs
        run: npm ci
      - working-directory: sdk/nextjs
        run: npm audit --audit-level=high
      - working-directory: sdk/nextjs
        run: npm run check
      - working-directory: sdk/nextjs
        run: npm test
      - working-directory: sdk/nextjs
        run: npm run build
      - working-directory: sdk/nextjs
        run: node scripts/package-smoke.mjs
