name: Rust SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Only pull requests share a group: release callers and main pushes each get
# their own, so they are never cancelled.
concurrency:
  group: sdk-rust-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sdk-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo fmt -p nelcota-client --check
      - run: cargo clippy -p nelcota-client --all-targets -- -D warnings
      - run: cargo test -p nelcota-client
      - run: cargo doc -p nelcota-client --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - run: cargo package -p nelcota-client
      - run: python sdk/rust/scripts/test-package.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # rust-toolchain.toml pins the workspace toolchain; `+1.88` overrides it.
      - run: cargo +1.88 test -p nelcota-client --locked
