# TEMPORARY (PR #239): builds the embedded panel on Linux so the versioned
# dist can be committed from a machine whose build is not reproducible.
# Remove in the same PR once the dist build commit lands.
name: Temporary panel dist build

on:
  pull_request:

permissions:
  contents: read

jobs:
  panel-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/admin/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git status --porcelain -- dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-dist
          path: crates/admin/ui/dist/
          retention-days: 1
