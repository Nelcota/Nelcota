name: Next.js SDK verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, browser: chromium }
          - { node: 24, browser: chromium }
          - { node: 26, browser: chromium }
          - { node: 24, browser: firefox }
          - { node: 24, browser: webkit }
          - { node: 24, browser: chromium, next: '15.5.28' }
          - { node: 24, browser: firefox, next: '15.5.28' }
          - { node: 24, browser: webkit, next: '15.5.28' }
    env:
      NELCOTA_NEXT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
      NELCOTA_NEXT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/ssr/package-lock.json
            sdk/nextjs/package-lock.json
      - run: scripts/test.sh db
      - name: Build base SDK
        run: npm --prefix sdk/typescript ci && npm --prefix sdk/typescript run build
      # The framework-agnostic session core the Next adapter is built on.
      - name: SSR core
        working-directory: sdk/ssr
        run: npm ci && npm audit --audit-level=high && npm run check && npm test && npm run build
      - run: npm ci
        working-directory: sdk/nextjs
      - run: npm audit --audit-level=high
        working-directory: sdk/nextjs
      - run: npm run check && npm test && npm run build
        working-directory: sdk/nextjs
      - run: node scripts/package-smoke.mjs
        working-directory: sdk/nextjs
      - name: Published base SDK consumer
        if: matrix.node == 24 && matrix.browser == 'chromium' && !matrix.next
        run: node scripts/package-smoke.mjs --published-base
        working-directory: sdk/nextjs
      # The apt mirror can be slow enough to time the job out, so the .deb
      # files fetched by --with-deps are cached next to the browsers. An install
      # that runs out of time still saves what it downloaded (as a partial
      # entry), so the next attempt resumes instead of starting over.
      - name: Restore Playwright browsers and system packages
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}-
      - name: Install browser
        id: playwright-install
        timeout-minutes: 12
        run: |
          mkdir -p ~/.cache/playwright-apt
          sudo find ~/.cache/playwright-apt -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          # The runner's default mirror (azure.archive.ubuntu.com) can crawl at
          # ~100 kB/s, and apt only falls back to the next mirror on errors, not
          # on slowness, so the main Ubuntu archive goes first here.
          sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          node sdk/typescript/node_modules/playwright-core/cli.js install --with-deps "${NELCOTA_NEXT_BROWSER}"
      - name: Collect downloaded system packages
        if: always() && steps.playwright-install.outcome != 'skipped' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
      - name: Save Playwright browsers and system packages
        if: always() && steps.playwright-install.outcome != 'skipped' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}${{ steps.playwright-install.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      - name: Server-only production boundary
        if: matrix.node == 24 && matrix.browser == 'chromium' && !matrix.next
        run: node scripts/boundary-smoke.mjs
        working-directory: sdk/nextjs
      - name: Earlier Next major compatibility
        if: matrix.next
        working-directory: sdk/nextjs
        env:
          NELCOTA_NEXT_COMPAT_VERSION: ${{ matrix.next }}
        run: node scripts/compatibility-smoke.mjs
      - name: Production framework, auth flows and two-process sessions
        if: ${{ !matrix.next }}
        working-directory: sdk/nextjs
        run: node scripts/framework-smoke.mjs
      - name: Remove disposable services
        if: always()
        run: docker rm -f nelcota-test-postgres || true

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NELCOTA_NEXT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
      NELCOTA_NEXT_TEST_S3_ENDPOINT: http://127.0.0.1:9100
      NELCOTA_NEXT_TEST_S3_ACCESS_KEY_ID: nelcotatest
      NELCOTA_NEXT_TEST_S3_SECRET_ACCESS_KEY: nelcotatestsecret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/test.sh db
      - run: npm --prefix sdk/typescript ci && npm --prefix sdk/typescript run build
      - run: npm ci && npm run build
        working-directory: sdk/ssr
      - run: npm ci && npm run build
        working-directory: sdk/nextjs
      - run: cargo build --locked -p nelcota-server
      - name: Real auth and STARTTLS email contracts
        run: node scripts/contract.mjs --nextjs test/contract/auth.test.ts
        working-directory: sdk/typescript
      - name: Real OAuth provider and PKCE contract
        run: scripts/test.sh rust --locked -p nelcota-server --test oauth rust_sdk_finishes_a_real_pkce_flow
      - name: Next SDK OAuth against the real backend
        run: scripts/test.sh rust --locked -p nelcota-server --test oauth nextjs_sdk_finishes_a_real_pkce_flow -- --ignored
      - name: Final backend adversarial matrix and sustained pool contention
        env:
          NELCOTA_NEXT_SOAK_SECONDS: '120'
        run: NELCOTA_NEXT_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/nelcota" node --conditions=react-server scripts/backend-smoke.mjs > backend-evidence.json
        working-directory: sdk/nextjs
      - name: Preserve backend validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextjs-backend-evidence
          path: sdk/nextjs/backend-evidence.json
          if-no-files-found: error
      - name: Start disposable S3 provider
        run: |
          docker run -d --name nelcota-next-s3 -p 127.0.0.1:9100:9000 \
            -e RUSTFS_ACCESS_KEY=nelcotatest -e RUSTFS_SECRET_KEY=nelcotatestsecret \
            rustfs/rustfs:1.0.1
          for _ in $(seq 1 60); do
            if curl --fail --silent "$NELCOTA_NEXT_TEST_S3_ENDPOINT/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: S3 redirects, credential stripping and range reads
        run: NELCOTA_NEXT_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/nelcota" node --conditions=react-server scripts/storage-smoke.mjs
        working-directory: sdk/nextjs
      - name: Remove disposable services
        if: always()
        run: docker rm -f nelcota-test-postgres nelcota-next-s3 || true

  # The SvelteKit adapter in a production adapter-node build of examples/sveltekit.
  sveltekit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      NELCOTA_SSR_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/ssr/package-lock.json
            sdk/ssr/examples/sveltekit/package-lock.json
      - name: Build base SDK
        run: npm --prefix sdk/typescript ci && npm --prefix sdk/typescript run build
      - run: npm ci && npm run build
        working-directory: sdk/ssr
      - run: npm ci && npm audit --audit-level=high
        working-directory: sdk/ssr/examples/sveltekit
      # The apt mirror can be slow enough to time the job out, so the .deb
      # files fetched by --with-deps are cached next to the browsers. An install
      # that runs out of time still saves what it downloaded (as a partial
      # entry), so the next attempt resumes instead of starting over.
      - name: Restore Playwright browsers and system packages
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}-
      - name: Install browser
        id: playwright-install
        timeout-minutes: 12
        run: |
          mkdir -p ~/.cache/playwright-apt
          sudo find ~/.cache/playwright-apt -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          # The runner's default mirror (azure.archive.ubuntu.com) can crawl at
          # ~100 kB/s, and apt only falls back to the next mirror on errors, not
          # on slowness, so the main Ubuntu archive goes first here.
          sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          node sdk/typescript/node_modules/playwright-core/cli.js install --with-deps "${NELCOTA_SSR_BROWSER}"
      - name: Collect downloaded system packages
        if: always() && steps.playwright-install.outcome != 'skipped' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
      - name: Save Playwright browsers and system packages
        if: always() && steps.playwright-install.outcome != 'skipped' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('sdk/typescript/package-lock.json') }}${{ steps.playwright-install.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      - name: SvelteKit sign-in, protected routes and sign-out
        working-directory: sdk/ssr
        run: node scripts/sveltekit-smoke.mjs
