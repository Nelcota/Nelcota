name: Review preset configuration

on:
  pull_request:
    paths:
      - '.oxlintrc.json'
      - '.oxlintignore'
      - 'presets/**'
      - 'scripts/install-oxlint.py'
      - 'scripts/run-preset.py'
      - 'scripts/review_tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/review-presets.yml'
  push:
    branches: [main]
    paths:
      - '.oxlintrc.json'
      - '.oxlintignore'
      - 'presets/**'
      - 'scripts/install-oxlint.py'
      - 'scripts/run-preset.py'
      - 'scripts/review_tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/review-presets.yml'

permissions:
  contents: read

jobs:
  native-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned native binary inside the checkout
        run: python3 scripts/install-oxlint.py
      - name: Validate configs, JSON contracts, ignores and fix boundaries
        run: python3 -m unittest discover -s scripts/review_tests -v
      - name: Check syntax with the base configuration
        run: python3 scripts/run-preset.py base
