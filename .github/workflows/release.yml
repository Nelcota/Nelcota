name: Release

on:
  push:
    tags: ["v*"]
  # Re-publishes an existing tag with this workflow (tags cannot move): the
  # code is the tag's, the build steps are main's.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.3.0
        required: true
        type: string

# Each job asks for what it needs.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    permissions:
      contents: write # release assets
      id-token: write # provenance attestation
      attestations: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - name: Release tag
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $RELEASE_TAG"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      # The same toolchain as rust-toolchain.toml, installed with the target:
      # otherwise cargo picks the pinned toolchain, which lacks the musl std.
      - uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1.0.8
        with:
          target: ${{ matrix.target }}
          toolchain: 1.99.1
          args: "--release --locked -p nelcota-server"
      - name: Package binary + checksum
        run: |
          cp target/${{ matrix.target }}/release/nelcota nelcota-${{ matrix.target }}
          sha256sum nelcota-${{ matrix.target }} > nelcota-${{ matrix.target }}.sha256
      # Signed build provenance: `gh attestation verify <file> -R Nelcota/Nelcota`.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nelcota-${{ matrix.target }}
      - name: Package binary provenance
        run: cp "${{ steps.provenance.outputs.bundle-path }}" nelcota-${{ matrix.target }}.attestation.jsonl
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            nelcota-${{ matrix.target }}
            nelcota-${{ matrix.target }}.sha256
            nelcota-${{ matrix.target }}.attestation.jsonl
      # The image job packs these same binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nelcota-${{ matrix.target }}
          path: nelcota-${{ matrix.target }}

  image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write # container storage record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nelcota-*
          path: artifacts
          merge-multiple: true
      # Docker names the architectures amd64/arm64 (TARGETARCH).
      - name: Binaries per Docker architecture
        run: |
          mkdir -p dist
          cp artifacts/nelcota-x86_64-unknown-linux-musl dist/nelcota-amd64
          cp artifacts/nelcota-aarch64-unknown-linux-musl dist/nelcota-arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image tag is the version without the "v" (same as NELCOTA_VERSION from init).
      - id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      # `nelcota-server`, not the repository name: ghcr.io/hanielcota/nelcota
      # belongs to an earlier project still deployed from it (D76). GHCR only
      # accepts lowercase names.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nelcota-server" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/release.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Links the GHCR package to this repository (and its Actions access).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
      - id: image-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-provenance
          path: ${{ steps.image-provenance.outputs.bundle-path }}

  ready:
    # A source tag is required by the controller's provenance policy.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image]
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nelcota-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-provenance
          path: image-provenance
      - name: Require exact-source main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/assert-update-ci.py
      - name: Complete release receipt
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 scripts/build-update-manifest.py --artifacts artifacts --tag "$RELEASE_TAG" --image-digest "$IMAGE_DIGEST" --ci update-ci.json
          cp image-provenance/* nelcota-image.attestation.jsonl
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: update-manifest.json
      - name: Package readiness provenance
        run: cp "${{ steps.provenance.outputs.bundle-path }}" update-manifest.json.attestation.jsonl
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            update-manifest.json
            update-manifest.json.attestation.jsonl
            nelcota-image.attestation.jsonl
