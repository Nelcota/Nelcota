name: SDK verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Check public SDK unit evidence privacy
        run: python3 -m unittest discover -s scripts/review_tests -p test_sdk_unit_evidence.py -v
        working-directory: .
      - name: SDK unit regressions
        id: sdk_unit
        run: |
          mkdir -p ../../target
          npm test -- --reporter=default --reporter=json --outputFile=../../target/sdk-unit-results.json
      - name: Public SDK unit counts and independent-client controls
        if: always() && (steps.sdk_unit.conclusion == 'success' || steps.sdk_unit.conclusion == 'failure')
        run: python3 ../../bench/sdk_unit_evidence.py ../../target/sdk-unit-results.json
      - run: npm run test:types
      - run: npm run build
      - run: npm run size
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
      - run: npm run test:memory
      - run: bun test/runtime/smoke.mjs
      - run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs
      - run: cargo build -p nelcota-server
        working-directory: .
      - run: npx playwright-core install --with-deps chromium firefox webkit
      - name: SDK server and browser contracts
        id: sdk_contract
        run: |
          set -o pipefail
          node scripts/contract.mjs --browser 2>&1 | tee "$RUNNER_TEMP/nelcota-sdk-contract.log"
        env:
          NELCOTA_SDK_BROWSERS: chromium,firefox,webkit
      - name: Annotate contract failure diagnostics
        if: failure() && steps.sdk_contract.conclusion == 'failure'
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'nelcota-sdk-contract.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()[-120:]
              message = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', '\n'.join(lines))
              # GitHub truncates long annotations from the end. Keep the error
              # tail rather than allowing fixture startup output to hide it.
              message = message.encode('utf-8')[-3000:].decode('utf-8', errors='replace')
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=SDK contract diagnostics::' + message)
          PY
      - name: documented Notes browser example
        timeout-minutes: 5
        run: python3 ../../scripts/test-onboarding.py --binary ../../target/debug/nelcota --browser
      - name: Notes browser acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes-browser-acceptance
          path: .tools/reports/onboarding/**/report.json
          if-no-files-found: ignore
          retention-days: 7

  sdk-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
      - run: npm run test:memory
