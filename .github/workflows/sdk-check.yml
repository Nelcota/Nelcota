name: SDK verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run size
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
      - run: npm run test:memory
      - run: bun test/runtime/smoke.mjs
      - run: deno run --allow-net --allow-read --allow-env test/runtime/smoke.mjs
      - run: cargo build -p nelcota-server
        working-directory: .
      - name: Restore Playwright browsers and system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-all-${{ hashFiles('sdk/typescript/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-all-
      - name: Install browsers
        # The apt mirror can be slow enough to time the job out, so the .deb
        # files fetched by --with-deps are cached next to the browsers.
        run: |
          mkdir -p ~/.cache/playwright-apt
          sudo find ~/.cache/playwright-apt -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          npx playwright-core install --with-deps chromium firefox webkit
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt {} +
      - name: SDK server and browser contracts
        id: sdk_contract
        run: |
          set -o pipefail
          node scripts/contract.mjs --browser 2>&1 | tee "$RUNNER_TEMP/nelcota-sdk-contract.log"
        env:
          NELCOTA_SDK_BROWSERS: chromium,firefox,webkit
      - name: Annotate contract failure diagnostics
        if: failure() && steps.sdk_contract.conclusion == 'failure'
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'nelcota-sdk-contract.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()[-120:]
              message = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', '\n'.join(lines))
              # GitHub truncates long annotations from the end. Keep the error
              # tail rather than allowing fixture startup output to hide it.
              message = message.encode('utf-8')[-3000:].decode('utf-8', errors='replace')
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=SDK contract diagnostics::' + message)
          PY
      - name: documented Notes browser example
        timeout-minutes: 5
        run: python3 ../../scripts/test-onboarding.py --binary ../../target/debug/nelcota --browser
      - name: Notes browser acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-browser-acceptance
          path: .tools/reports/onboarding/**/report.json
          if-no-files-found: ignore
          retention-days: 7

  sdk-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:package
      - run: node test/runtime/smoke.mjs
      - run: npm run test:memory
