name: SDK release

# Publishes @nelcota/client to npm from a `sdk-v<version>` tag, with npm
# trusted publishing (OIDC, no token stored in the repository) and a
# provenance statement linking the package to this workflow run.
# Before the first run, add this repository and workflow as a trusted
# publisher of @nelcota/client on npmjs.com.

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/sdk-check.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -p "require('./package.json').version")
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      # A version published by hand (the first one) is not published again.
      - name: skip a version already on npm
        id: published
        run: |
          version=$(bun -p "require('./package.json').version")
          if npm view "@nelcota/client@$version" version >/dev/null 2>&1; then
            echo "::notice::@nelcota/client@$version is already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - if: steps.published.outputs.skip != 'true'
        run: bun run build
      # The complete verification job already checked this tagged commit.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance --ignore-scripts
