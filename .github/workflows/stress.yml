name: P12 disposable Docker daemon verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p12-docker-${{ github.repository }}
  cancel-in-progress: false
jobs:
  p12-docker-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact product trees and provided binary
        run: python3 target/p12-input/verify.py
      - name: Owned daemon restart and both original restart policies
        timeout-minutes: 12
        run: python3 target/pitr-reboot-fence/operator/docker-probe.py --binary target/p12-input/nelcota --output target/p12-docker --allow-disposable-daemon-restart
      - name: Preserve structured P12 Docker evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import base64,gzip,hashlib,json
          from pathlib import Path
          p=Path('target/p12-docker/report.json')
          if p.exists():
              raw=p.read_bytes();assert len(raw)<65536
              print('::notice title=P12 Docker policy evidence::'+json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'encoding':'gzip+base64','payload':base64.b64encode(gzip.compress(raw,mtime=0)).decode()}))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p12-docker-daemon-evidence
          path: target/p12-docker/report.json
          retention-days: 14
          if-no-files-found: error
