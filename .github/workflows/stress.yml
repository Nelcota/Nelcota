name: Release stress campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    # Dedicated host with at least three CPUs and Docker. Heavy load is kept
    # off pull-request runners and uses explicit per-container budgets.
    runs-on: [self-hosted, linux, x64, nelcota-benchmark]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: nice -n19 ionice -c3 cargo build --locked --release -p nelcota-server
      - run: nice -n19 ionice -c3 python3 bench/campaign.py --binary target/release/nelcota --output target/stress-report
      - name: Campaign diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-stress-report
          path: target/stress-report
          if-no-files-found: ignore
          retention-days: 14
