name: SSR SDK release

on:
  push:
    tags: ['ssr-sdk-v*']

permissions:
  contents: read

jobs:
  # The core's tests, and every Next.js framework/backend check built on it.
  verify:
    uses: ./.github/workflows/sdk-nextjs-check.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/ssr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release metadata and published base dependency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import metadata from "./package.json" with { type: "json" };
            if (process.env.RELEASE_TAG !== `ssr-sdk-v${metadata.version}` || metadata.private === true) process.exit(1);
          '
          npm view @nelcota/client@0.2.2 version
      - name: Skip an already published version
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@nelcota/ssr@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci && npm run build
        working-directory: sdk/typescript
      - if: steps.published.outputs.skip != 'true'
        run: npm ci && npm run build
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance --ignore-scripts
