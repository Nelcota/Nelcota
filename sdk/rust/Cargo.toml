[package]
name = "nelcota-client"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Async Rust client for Nelcota: Postgres REST, authentication and file storage"
repository = "https://github.com/Nelcota/Nelcota"
readme = "README.md"
keywords = ["nelcota", "postgres", "baas", "sdk", "async"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "examples/**", "tests/**", "test/**", "README.md", "CHANGELOG.md", "LICENSE", "docs/**", "Cargo.toml"]

[dependencies]
base64.workspace = true
bytes.workspace = true
getrandom.workspace = true
httpdate = "1.0.3"
reqwest = { workspace = true, features = ["json", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt", "io"] }
unicode-normalization = "0.1.25"
url.workspace = true
webpki-roots = "1.0.9"

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "test-util"] }

[lints]
workspace = true
