[advisories]
# rsa (via jsonwebtoken/rust_crypto): the Marvin Attack affects operations with
# the PRIVATE RSA key. Nelcota never signs with RSA (HS256 in milestone 1, EdDSA
# in milestone 2). Revisit if RS256 is adopted for signing. See docs/decisions.md.
# crypto-bigint 0.5 (via p256/p384 in jsonwebtoken/openidconnect): timing issues
# affect secret integers; ECDSA here only verifies public signatures. See D104.
# astral-tokio-tar (via testcontainers, dev-dependencies only): unmaintained, no
# vulnerability and no maintained release to move to. Never shipped. See D118.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387", "RUSTSEC-2026-0440"]
