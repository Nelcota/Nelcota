[package]
name = "nelcota-storage"
description = "File storage: metadata under RLS in Postgres, bytes on disk or S3."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base16ct.workspace = true
nelcota-core.workspace = true
nelcota-auth.workspace = true
axum.workspace = true
async-trait = "0.1.92"
bytes.workspace = true
deadpool-postgres.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs"] }
tokio-postgres.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }
# Free space of the disk backend (D80).
fs4 = { version = "1.1.0", default-features = false }
httpdate = "1.0.3"
# File type from the first bytes, never from the client (D79).
infer = { version = "0.22.0", default-features = false, features = ["alloc"] }
# S3 and the local disk behind one interface (D77). `ring`, never `aws-lc-rs` (D16).
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
percent-encoding = "2.3.2"
# Only to pick reqwest's TLS without a bundled provider: rustls uses `ring`, installed at startup.
reqwest.workspace = true
rustls.workspace = true
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
