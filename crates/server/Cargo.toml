[package]
name = "nelcota-server"
description = "The single Nelcota binary: API, auth, admin panel and CLI together."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "nelcota"
path = "src/main.rs"

[dependencies]
nelcota-core.workspace = true
nelcota-auth.workspace = true
nelcota-api.workspace = true
nelcota-cli.workspace = true
nelcota-admin.workspace = true
nelcota-storage.workspace = true
nelcota-webhooks.workspace = true
anyhow.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["matched-path"] }
deadpool-postgres.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
nelcota-client = { path = "../../sdk/rust" }
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
form_urlencoded.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
refinery.workspace = true
serde_json.workspace = true
sha2.workspace = true
testcontainers-modules.workspace = true
tokio-postgres.workspace = true
tower.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
