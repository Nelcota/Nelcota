[package]
name = "nelcota-admin"
description = "nelcota admin panel: JSON API plus the embedded Svelte frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
nelcota-deployment = { workspace = true, features = ["schema"] }
anyhow.workspace = true
url.workspace = true
nelcota-core.workspace = true
nelcota-auth.workspace = true
nelcota-storage.workspace = true
nelcota-api.workspace = true
nelcota-webhooks.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cookie.workspace = true
deadpool-postgres.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
refinery.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
base16ct.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "sync"] }
tokio-postgres.workspace = true
tracing.workspace = true
ts-rs = "12.0.1"
schemars.workspace = true

[build-dependencies]
# Precompress the embedded panel at build time (build.rs).
brotli = "9.0.0"
sha2.workspace = true
base16ct.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Already compiled in the tree; checks the exported patterns against the Rust validators.
regex = "1.13.1"
tower.workspace = true
tower-http.workspace = true
brotli = "9.0.0"
flate2 = "1.1.10"
tempfile = "3.27.0"
