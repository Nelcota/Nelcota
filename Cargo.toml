[workspace]
resolver = "3"
members = ["crates/*", "sdk/rust"]

[workspace.package]
version = "0.5.3"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.99"
repository = "https://github.com/Nelcota/Nelcota"

[workspace.dependencies]
nelcota-core = { path = "crates/core", version = "0.5.3" }
nelcota-auth = { path = "crates/auth", version = "0.5.3" }
nelcota-api = { path = "crates/api" }
nelcota-cli = { path = "crates/cli" }
nelcota-deployment = { path = "crates/deployment" }
nelcota-admin = { path = "crates/admin" }
nelcota-storage = { path = "crates/storage" }
nelcota-webhooks = { path = "crates/webhooks" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "macros", "form"] }
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
base64 = "0.23.1"
bytes = "1.12.1"
# Cookie parsing and Set-Cookie building for the panel session (no signing/encryption features).
cookie = { version = "0.18.2", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color", "env"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
getrandom = "0.4.3"
# Keyed GCRA rate limiter, in memory. std clock only: no quanta, no jitter (rand).
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap"] }
http-body-util = "0.1.5"
hmac = "0.13.0"
# HTTP client for the panel's project health probes (hyper is already in the tree via axum).
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
# SMTP over rustls + ring with Mozilla's roots bundled (the scratch image has no
# system certificates). No native-tls/OpenSSL: the musl build stays static.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
postgres-protocol = "0.6.12"
# Protocol clients use our bounded reqwest transport, retaining the same TLS
# provider and avoiding a second reqwest version.
oauth2 = { version = "5.0.0", default-features = false }
openidconnect = { version = "4.0.1", default-features = false }
# HTTPS client (S3, OAuth providers) without a bundled TLS provider: rustls
# runs on `ring`, installed at startup, never `aws-lc-rs` (D16).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
refinery = { version = "0.10.0", default-features = false, features = ["tokio-postgres"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors", "timeout", "trace", "compression-gzip", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_else = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
